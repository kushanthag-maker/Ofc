
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>MINI BOT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: url('https://png.pngtree.com/png-clipart/20250318/original/pngtree-anime-girl-embracing-her-stomach-in-a-delicate-expression-image-clipart-png-image_20679807.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: #4fc3f7; /* Changed to light blue */
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      box-shadow: 0 0 15px #4fc3f7, 0 0 30px #0288d1; /* Light blue shades */
      animation: logoGlow 2s infinite ease-in-out;
    }

    @keyframes logoGlow {
      0%, 100% { box-shadow: 0 0 15px #4fc3f7, 0 0 30px #0288d1; }
      50% { box-shadow: 0 0 25px #4fc3f7, 0 0 40px #0288d1; }
    }

    .box {
      width: 360px;
      padding: 30px;
      background: linear-gradient(145deg, #1a1a1a, #2c2c2c);
      border: 2px solid #4fc3f7; /* Changed to light blue */
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 30px rgba(79, 195, 247, 0.5); /* Light blue shadow */
      background-clip: padding-box;
      position: relative;
      z-index: 2;
      animation: pulse 3s infinite ease-in-out, float 4s infinite ease-in-out;
      transition: transform 0.3s ease;
    }

    .box:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 0 40px rgba(79, 195, 247, 0.8); /* Light blue shadow */
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(79, 195, 247, 0.5); }
      50% { transform: scale(1.015); box-shadow: 0 0 40px rgba(79, 195, 247, 0.7); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; text-shadow: 0 0 5px #81d4fa, 0 0 20px #81d4fa; } /* Light blue shadow */
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: translateY(-20px); }
      60% { opacity: 1; transform: translateY(5px); }
      100% { transform: translateY(0); }
    }

    h3, h6 {
      color: #4fc3f7;
      animation: flicker 2s infinite alternate;
      margin: 10px 0;
    }

    h3 {
      animation: bounceIn 1s ease-out, flicker 2s infinite alternate;
      font-size: 1.8em;
    }

    h6 {
      animation: bounceIn 1.2s ease-out, flicker 2s infinite alternate;
      font-size: 1em;
    }

    .input-container {
      display: flex;
      width: 100%;
      margin-top: 20px;
    }

    .input-container input,
    .input-container button {
      height: 3.5rem;
      font-size: 1.1rem;
      border: none;
      outline: none;
      box-sizing: border-box;
      appearance: none;
      font-family: 'Orbitron', sans-serif;
    }

    .input-container input {
      width: 70%;
      border-radius: 0.8rem 0 0 0.8rem;
      background: #e1f5fe; 
      color: #000;
      padding-left: 1rem;
      transition: box-shadow 0.3s ease;
    }

    .input-container input:focus {
      box-shadow: 0 0 15px #4fc3f7; 
    }

    .input-container button {
      width: 30%;
      border-radius: 0 0.8rem 0.8rem 0;
      background: #0288d1; 
      color: #fff; 
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .input-container button:hover {
      background: #81d4fa; 
      transform: scale(1.05);
      box-shadow: 0 0 15px #81d4fa; 
    }

    a.centered-text {
      color: white;
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <i class="fas fa-robot" style="color: #000; font-size: 30px;"></i>
    </div>
    <div class="box" id="box">
      <div id="text">
        <i class="fa fa-user" style="color:#4fc3f7;"></i> 
        <h3> MINI BOT</h3>
        
        <h6>🔢 Enter your number with country code</h6>

        <div class="input-container">
          <input placeholder="9476xxxxxxx" type="number" id="number">
          <button id="submit">Submit</button>
        </div>

        <a id="waiting-message" class="centered-text" style="display: none;">Please wait a while...</a>
        <main id="pair"></main>

      </div>
      
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let a = document.getElementById("pair");
    let b = document.getElementById("submit");
    let c = document.getElementById("number");

    async function Copy() {
      let text = document.getElementById("copy").innerText;
      let obj = document.getElementById("copy");
      await navigator.clipboard.writeText(obj.innerText.replace('CODE: ', ''));
      obj.innerText = "COPIED";
      obj.style = "color:blue;font-weight:bold";
      obj.size = "5";
      setTimeout(() => {
        obj.innerText = text;
        obj.style = "color:white;font-weight-bold";
        obj.size = "5";
      }, 500);
    }

    b.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!c.value) {
        a.innerHTML = '<a style="color:white;font-weight:bold">Enter your WhatsApp number with Country Code</a><br><br>';
      } else if (c.value.replace(/[^0-9]/g, "").length < 11) {
        a.innerHTML = '<a style="color:red;font-weight:bold">Invalid Number</a><br><br>';
      } else {
        const number = c.value.replace(/[^0-9]/g, "");
        c.type = "text";
        c.value = "+" + number;
        c.style = "color:black;font-size:20px";
        a.innerHTML = '<a style="color:white;font-weight:bold">Please Wait...</a><br><br>';
        let { data } = await axios(`/code?number=${number}`);
        let code = data.code || "Service Unavailable";
        a.innerHTML = `<font id="copy" onclick="Copy()" style="color:red;font-weight:bold" size="5">CODE: <span style="color:white;">${code}</span></font><br><br><br>`;
      }
    });
  </script>
</body>
</html>
