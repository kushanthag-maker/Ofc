<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEXUS MD - Pair</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0f0f;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    .box {
      background: #1a1a1a;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 25px rgba(79, 195, 247, 0.4);
      width: 340px;
    }
    h2 {
      color: #4fc3f7;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4fc3f7;
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #29b6f6;
    }
    #result {
      margin-top: 20px;
      font-size: 14px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>👻 NEXUS MD Pair</h2>
    <input type="text" id="number" placeholder="Enter number (9477xxxxxxx)" />
    <button onclick="getCode()">Get Pairing Code</button>
    <div id="result"></div>
  </div>

  <script>
    async function getCode() {
      const number = document.getElementById('number').value.trim();
      if (!number) {
        document.getElementById('result').innerText = "Please enter a number";
        return;
      }

      document.getElementById('result').innerText = "Generating code... Please wait";

      try {
        const res = await fetch(`/code?number=${number}`);
        const data = await res.json();
        
        if (data.code) {
          document.getElementById('result').innerHTML = `<b>Code:</b> <span style="color:#4fc3f7;font-size:22px">${data.code}</span>`;
        } else if (data.status === 'already_connected') {
          document.getElementById('result').innerText = "This number is already connected";
        } else {
          document.getElementById('result').innerText = JSON.stringify(data);
        }
      } catch (err) {
        document.getElementById('result').innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
