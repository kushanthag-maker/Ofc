<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Docs & Commands - DCL MINI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">⚡ DCL MINI</div>
    <div class="navlinks">
      <a href="/">Home</a>
      <a href="/pair">Pairing</a>
      <a href="/docs">Docs</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </div>
  </nav>

  <div class="container">
    <section class="hero" style="padding-top:20px">
      <h1>Command <span>Documentation</span></h1>
      <p>All commands use the prefix set in your .env (default: <code>.</code>)</p>
    </section>

    <div id="commandList" class="grid"></div>
  </div>

  <footer>DCL MINI &copy; 2026 — Built with Baileys, Node.js & MongoDB</footer>

  <script>
    async function loadCommands() {
      const res = await fetch('/api/commands');
      const cmds = await res.json();
      const container = document.getElementById('commandList');
      const byCat = {};
      cmds.forEach(c => { (byCat[c.category] ||= []).push(c); });

      container.innerHTML = '';
      Object.entries(byCat).forEach(([cat, list]) => {
        const section = document.createElement('div');
        section.style.gridColumn = '1 / -1';
        section.innerHTML = `<h2 style="margin:30px 0 10px;text-transform:capitalize">${cat} Commands</h2>`;
        container.appendChild(section);

        const grid = document.createElement('div');
        grid.className = 'grid';
        grid.style.marginTop = '0';
        list.forEach(c => {
          grid.innerHTML += `<div class="card"><h3>.${c.name} ${c.ownerOnly ? '👑' : ''}</h3><p>${c.description || ''}</p></div>`;
        });
        container.appendChild(grid);
      });
    }
    loadCommands();
  </script>
</body>
</html>
